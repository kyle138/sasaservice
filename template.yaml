AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sasaservice

  Sample SAM Template for sasaservice
  
# Globals
Globals:
  Function:
    Timeout: 29
    MemorySize: 128
    Runtime: nodejs24.x

Parameters:
  DomainName:
    Type: String
    Description: The primary domain for this website.
  AcmCertificateId:
    Type: String
    Description: The ID of the ACM SSL certificate.

Resources:
  SaasApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # Ratelimits 
      MethodSettings:
        - ResourcePath: '/*'        # Applies rate limits across all endpoints
          HttpMethod: '*'           # Applies rate limits across all methods
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Cors: 
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        # AllowOrigin: !Sub "'https://${DomainName}'"
        AllowOrigin: "'*'"
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common-layer
      LayerName: common-layer
      Description: is-letter-s create-response-object
      CompatibleRuntimes:
        - nodejs24.x
    Metadata:
      BuildMethod: nodejs24.x
  GetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/get.handler
      Layers: 
        - !Ref CommonLayer
      Architectures:
        - x86_64
      Events:
        SaasGet:
          Type: Api
          Properties:
            Path: /api
            Method: get
            RestApiId: !Ref SaasApi
  PostFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: src/
      Handler: handlers/post.handler
      Layers: 
        - !Ref CommonLayer
      Architectures:
        - x86_64
      Events:
        SaasPost:
          Type: Api
          Properties:
            Path: /api
            Method: post
            RestApiId: !Ref SaasApi
  FeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/feedback.handler
      Layers:
        - !Ref CommonLayer
      Architectures:
        - x86_64
      Policies: 
        - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/sam-feedbackform-Feedbacks"
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/sam-feedbackform-Feedbacks/index/*"
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/errorLogs"
                  - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/errorLogs/index/*"
      Events:
        FeedbackPost:
          Type: Api
          Properties:
            Path: /api/feedback
            Method: post
            RestApiId: !Ref SaasApi
      Environment:
        Variables:
          FEEDBACKS_TABLE_NAME: "sam-feedbackform-Feedbacks"
  CronServedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/cronserved.handler
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref WebsiteBucket
          APIG_NAME: !Ref SaasApi
          STAGE_NAME: "prod"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/data/served.json"
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}"
          - Effect: Allow
            Action: 
              - cloudwatch:GetMetricData
            Resource: "*"
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource:
              - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/errorLogs"
              - !Sub "arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/errorLogs/index/*"
      Events:
        NightlyCron:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 * * ? *) # Runs every day at 00:05 AM UTC
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-bucket"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: 
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  StaticAssetResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: StaticAssetExpiresPolicy
        CustomHeadersConfig:
          Items:
            # Modern HTTP/1.1 cache control (Recommended)
            - Header: Cache-Control
              Value: "public, max-age=31536000, immutable"
              Override: true
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig: 
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Sub "arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${AcmCertificateId}"
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 86400
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 86400
        Origins:
          # Static S3 assets
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApigOrigin
            DomainName: !Sub "${SaasApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
            OriginPath: "/prod"
        # Default routing to S3 static 
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - HEAD
            - GET
            - OPTIONS
          CachedMethods:
            - HEAD
            - GET
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          ResponseHeadersPolicyId: !Ref StaticAssetResponseHeadersPolicy
        # Routing for API calls
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApigOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: 
              - HEAD
              - DELETE
              - POST
              - GET
              - OPTIONS
              - PUT
              - PATCH
            DefaultTTL: 0 # To bypass CDN cache for dynamic API calls
            MaxTTL: 0
            MinTTL: 0
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
              Cookies:
                Forward: all
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

Outputs:
  WebsiteURL:
    Description: Production URL
    Value: !Sub "https://${DomainName}"
  BackendApiURL:
    Description: Unified APIG endpoint via CF
    Value: !Sub "https://${DomainName}/api"
